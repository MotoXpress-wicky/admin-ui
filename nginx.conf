# Serves the built React app. The big Nginx in front of it (infrastructure repo) sends /api/ elsewhere.
#
# Security headers: nginx forgets the headers of the outer block when a location has its own add_header,
# so the same three lines are repeated in each location.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Files with a hash in the name never change, so the browser may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # React Router: every other address is a page inside the app, so send index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
