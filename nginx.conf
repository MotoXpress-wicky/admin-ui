# Serves the built React app. The big Nginx in front of it (infrastructure repo) sends /api/ elsewhere.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Files with a hash in the name never change, so the browser may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every other address is a page inside the app, so send index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
