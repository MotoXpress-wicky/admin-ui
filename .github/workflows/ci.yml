# Checks every push and pull request: lint, TypeScript types and the production build (docs/mvp/13-ci-cd.md).
name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      # "build" runs tsc (types) and then vite build
      - run: npm run build
